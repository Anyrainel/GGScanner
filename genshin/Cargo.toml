[package]
name = "genshin_scanner"
version = "0.2.0"
edition = "2021"
description = "Genshin Impact item scanner"
repository = "https://github.com/wormtql/yas"
keywords = ["GenshinImpact", "artifacts", "scanner", "ocr"]
license = "GPL-2.0-or-later"

[build-dependencies]
time = "0.3"

[dev-dependencies]
time = "0.3"

[features]
default = []
capture = [
    "dep:auto-artifactarium",
    "dep:protobuf",
    "dep:indexmap",
    "dep:base64",
    "dep:tokio-util",
    "dep:pktmon",
]

[dependencies]
yas = { path = "../yas", package = "yas_core", features = ["ort"] }
anyhow = "1.0"
log = "0.4"
clap = { version = "4.4", features = ["derive", "cargo"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp", "rayon"] }
serde_json = "1.0"
regex = "1.5"
lazy_static = "1.4"
ab_glyph = "0.2"
serde = { version = "1.0", features = ["derive"] }
enigo = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
crossbeam-channel = "0.5"
rayon = "1.7"
indicatif = "0.18.6"
indicatif-log-bridge = "0.2"
zip = "9.0.3"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time"] }
futures = "0.3"
sha2 = "0.10"
flate2 = "1.0"

# capture-only dependencies
auto-artifactarium = { git = "https://github.com/konkers/auto-artifactarium", rev = "4ba25fac64b88970143af6bc2a2ef51338e620d0", optional = true }
protobuf = { version = "3.7", optional = true }
indexmap = { version = "2", optional = true }
base64 = { version = "0.23.1", optional = true }
tokio-util = { version = "0.7", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# ONNX Runtime .tgz extraction for the Linux auto-download flow.
tar = "0.4"
# System-libonnxruntime.so presence probe via the dynamic loader (already a
# transitive dependency through ort's load-dynamic feature).
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
pktmon = { version = "0.6", features = ["tokio"], optional = true }
