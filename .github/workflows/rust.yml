name: Build (manual release)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish binaries as a GitHub release
        type: boolean
        required: true
        default: false

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_LTO: "fat"
  CARGO_PROFILE_RELEASE_INCREMENTAL: "false"
  RELEASE_DIRECTORY: release-package

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract version
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $tag = "v$date"
          "VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Require an unused release tag
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: ./.github/scripts/check-release-available.ps1 -Tag $env:VERSION -Repository $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check bundled capture keys
        run: |
          python -m unittest discover -s scripts -p test_check_capture_keys.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/check_capture_keys.py --revision HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Setup Toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt

      - name: Test user-facing error diagnostics
        run: |
          ./.github/scripts/test-release-packaging.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s scripts -p test_retire_legacy_downloads.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p yas_core --features ort --lib --test window_enumeration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p genshin_scanner --lib scan_worker::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p genshin_scanner --lib updater::tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p good_tools_app --features test-as-invoker --test ui_error --test update_restart --test shared_games --test gui_layout --test gui_feedback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p good_tools_app --features capture,test-as-invoker --test ui_error --test shared_games --test gui_layout --test gui_feedback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p good_tools_app --features capture,test-as-invoker --lib feedback_tests

      - name: Set version in Cargo.toml
        run: |
          $files = @(
              './Cargo.toml'
              './yas/Cargo.toml'
              './genshin/Cargo.toml'
              './application/Cargo.toml'
          )
          # Pack the date into major and the release build into minor.
          # Cargo requires 3-part semver; pack YYYYMMDD into major
          $d = Get-Date -Format "yyyyMMdd"
          $ver = "$d.${{ github.run_number }}.0"
          [regex]$pattern = '(?<=version = ").*(?=")'
          foreach ($file in $files) {
              $pattern.Replace((Get-Content -Raw $file), $ver, 1) | Out-File -FilePath $file
          }

      - name: Build GGScannerOCR (Release)
        run: cargo build --release --bin GGScannerOCR

      - name: Build GGScanner (Release)
        run: cargo build --release --bin GGScanner --features capture

      - name: Package canonical downloads and temporary compatibility copies
        run: |
          ./.github/scripts/prepare-release.ps1 -Tag $env:VERSION -Revision ${{ github.run_number }} -OutputDirectory $env:RELEASE_DIRECTORY

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GGScanner_${{ env.VERSION }}
          path: ${{ env.RELEASE_DIRECTORY }}/*

      - name: Generate bilingual release description
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          # Keep this machine-readable line for legacy and current updaters.
          "Build revision: ${{ github.run_number }}" | Set-Content -Encoding utf8 release-notes.md
          Add-Content -Encoding utf8 release-notes.md ""
          Get-Content -Raw .github/release-description.md | Add-Content -Encoding utf8 release-notes.md

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        run: |
          # Create only: a concurrent publication must fail, never edit a release.
          $files = @(Get-ChildItem -LiteralPath $env:RELEASE_DIRECTORY -File | Sort-Object Name | Select-Object -ExpandProperty FullName)
          gh release create $env:VERSION @files --target $env:GITHUB_SHA --title $env:VERSION --notes-file release-notes.md --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
