[workspace]
resolver = "2"
members = [
    "yas",
    "genshin",
    "application",
    "experimental/hsr",
]
exclude = ["vendor/auto-artifactarium"]

[patch."https://github.com/konkers/auto-artifactarium"]
auto-artifactarium = { path = "vendor/auto-artifactarium" }

[profile.release]
# Keep local release rebuilds fast; GitHub Actions overrides these for artifacts.
lto = "off"
incremental = true
panic = "unwind"
strip = true
